name: GitHub Actions - Code Validation
run-name: ${{ github.actor }} Code Validation
on:
  push:
    branches: ["LaPockett-patch-1"]
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'jetbrains'
  MAVEN_CACHE: 'gradle'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.MAVEN_CACHE }}
      - name: Start Code Validation
        run: ./gradlew lint
      - run: echo "This job's status is ${{job.status}}."







