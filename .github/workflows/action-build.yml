name: GitHub Actions - Build app
run-name: ${{ github.actor }} Build app
on:
  push:
    branches: ["master", "LaPockett-patch-1"]
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'jetbrains'
  MAVEN_CACHE: 'gradle'
  NODE_VERSION: '18'
jobs:
  call-workflow-1-in-local-repo:
    uses: ./.github/workflows/action-setup.yml
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew bundleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: composeApp/build/outputs/apk/release/app-release.apk




