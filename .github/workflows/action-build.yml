name: GitHub Actions - Build app
run-name: ${{ github.actor }} Build app
on:
  push:
    branches: ["master"]
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_CACHE: 'gradle'
  NODE_VERSION: '18'
jobs:
  build:
    - name: Set up project
      uses: ./.github/workflows/action-setup.yml
    - name: Build
      run: ./gradlew bundleRelease
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk




