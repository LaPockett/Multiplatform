name: GitHub Actions - Appium iOS Tests
run-name: ${{ github.actor }} Appium iOS Tests
on:
  push:
    branches: [test-appium-ios]
env:
  APPIUM_VERSION: '2.18.0'
  XCODE_VERSION: '16.4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  appium:
    runs-on: macos-self-hosted
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.14.0'

      - name: Setup Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install webdriverio
        run: |
          npm i --save-dev webdriverio

      - name: Install Appium
        uses: FinbertMDS/setup-appium@v1.0.0
        with:
          appium-version: ${{ env.APPIUM_VERSION }}

      - name: Start iOS emulator
        run: |
          xcrun simctl list devices
          xcrun simctl boot "iPhone 16 Plus"
          xcrun simctl list devices | grep Booted

      - name: Install App on Simulator
        run: |
          xcrun simctl install booted /Users/diandev/Library/Developer/Xcode/DerivedData/iosApp-cxvmnyreegduinaikhhllxfkbdrr/Build/Products/Debug-iphonesimulator/KotlinProjectPrueba.app
      - name: Start appium
        run: |
          appium --log-level debug &
      - name: Run iOS tests
        run: |
          npm run test-ios
          xcrun simctl shutdown booted