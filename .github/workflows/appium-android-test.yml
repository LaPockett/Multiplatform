name: GitHub Actions - Appium Tests
run-name: ${{ github.actor }} Appium Tests
on:
  pull_request:
    types: [closed]
env:
  APPIUM_VERSION: '2.18.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow:
    if: github.event.pull_request.merged == true
    uses: LaPockett/Multiplatform/.github/workflows/setup-project.yml@master

  appium:
    if: github.event.pull_request.merged == true
    needs: call-workflow
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - name: Checkout Project
        uses: actions/checkout@v6.0.2

      - name: Clean emulator lock files
        run: |
          rm -f /home/usuario/.android/avd/*.avd/*.lock
          rm -f /home/usuario/.android/avd/*.avd/hardware-qemu.ini.lock

      # Only enable on github-hosted runners.
      # Forself-hosted runners, execute ./prepareSelfHostedRunner.sh
      #- name: Enable KVM group perms
      #  run: |
      #    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      #    sudo udevadm control --reload-rules
      #    sudo udevadm trigger --name-match=kvm

      - name: Install Appium
        uses: FinbertMDS/setup-appium@v1.0.0
        with:
          appium-version: ${{ env.APPIUM_VERSION }}

      - name: Run Appium
        run: |
          npm --version
          echo "NPM AUDIT"
          npm audit
          echo "NPM AUDIT FIX"
          npm audit fix
          npm i --save-dev webdriverio
          npm ci
          appium --version
          appium & sleep 5

      - name: Android Emulator Runner with Tests
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 29
          target: default
          profile: Nexus 4
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb devices -l
            adb wait-for-device
            adb install /home/usuario/releases-apk-for-appium/composeApp-release.apk
            npm run test-all
            echo "Closing connection with emulator-5554 Test"
            adb -s emulator-5554 emu kill || true