name: Prepare deploy test
run-name: ${{ github.actor }} Prepare deploy test
on:
  pull_request:
    types: [closed]
    branches: [master]
  push:
    branches: [master]
jobs:
  publish:
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/master'

    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
        - name: Checkout
          uses: actions/checkout@v4.2.2
        - name: npm
          run: |
            npm audit
            npm audit fix
        - name: Semantic Release
          uses: cycjimmy/semantic-release-action@v4.2.1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          with:
            extra_plugins: |
              @semantic-release/git
              @semantic-release/exec
              @semantic-release/changelog
            branch: master