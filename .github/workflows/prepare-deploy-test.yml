# Lo dejo para futuros proyectos personales míos donde sí me interese publicar los paquetes en npm
# Está deshabilitado en GitHub
name: Prepare deploy test
run-name: ${{ github.actor }} Prepare deploy test
on:
  pull_request:
    types: [closed]
    branches: [master]
  push:
    branches: [master]
jobs:
  call-workflow:
    uses: LaPockett/Multiplatform/.github/workflows/setup-project.yml@master
  publish:
    needs: call-workflow
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/master'
    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
        - name: Checkout
          uses: actions/checkout@v6.0.2
        - name: npm
          run: |
            npm audit
            npm audit fix
        - name: Semantic Release
          uses: cycjimmy/semantic-release-action@v6.0.0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          with:
            extra_plugins: |
              @semantic-release/git
              @semantic-release/exec
              @semantic-release/changelog
            branch: master