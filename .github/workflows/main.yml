name: Setup - Lint, Unit Test and UI test
run-name: ${{github.actor}} Setup - Lint, Unit Test and UI test
on:
  push:
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_CACHE: 'gradle'
  NODE_VERSION: '20'
  MAIN_PROJECT_MODULE: 'composeApp'
  PLAYSTORE_NAME: 'App Mock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow:
    uses: LaPockett/Multiplatform/.github/workflows/setup.yml@master

  lint:
    needs: call-workflow
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew lint --stacktrace

  unit-test:
    needs: call-workflow
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew testdebugUnitTest --stacktrace

  ui-test:
    needs: call-workflow
    runs-on: self-hosted
    steps:
      - name: Clean emulator lock files
        run: |
         rm -f /home/usuario/.android/avd/*.avd/*.lock
         rm -f /home/usuario/.android/avd/*.avd/hardware-qemu.ini.lock

      - uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android Emulator Runner with Tests
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 29
          profile: Nexus 6
          emulator-options: -no-audio -no-snapshot -no-window -gpu swiftshader_indirect
          arch: x86_64
          script: |
            ./gradlew connectedAndroidTest --stacktrace

  export-results:
    needs: [lint, unit-test, ui-test]
    runs-on: ubuntu-latest
    outputs:
      all_tests_passed: ${{ !contains(needs.*.result, 'failure') }}
    steps:
      - name: Check if all tests passed
        run: |
          echo ${{ !contains(needs.*.result, 'failure') }}"

  call-build-apk:
    needs: export-results
    if: github.ref == 'refs/heads/master' && needs.export-results.outputs.all_tests_passed == 'true'
    uses: ./.github/workflows/build-apk.yml
    with:
      all_tests_passed: ${{ needs.export-results.outputs.all_tests_passed }}
