name: Main
run-name: ${{github.actor}} Main
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_CACHE: 'gradle'
  NODE_VERSION: '20'
  MAIN_PROJECT_MODULE: 'Multiplatform'
  PLAYSTORE_NAME: 'App Mock'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.MAVEN_CACHE }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew lint

  build-apk:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Decode key from base64
        run: |
          echo "${{ secrets.ANDROID_STORE_FILE }}" | base64 -d > composeApp/keydemiapp.jks
          ls -la composeApp/
      - name: Verify keystore (optional)
        run: |
          keytool -list -v -keystore composeApp/keydemiapp.jks -storepass ${{ secrets.ANDROID_STORE_PASSWORD }} -alias ${{ secrets.ANDROID_KEY_ALIAS }}
        continue-on-error: true
      - run: find . -name "*.jks"
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: Build apk ${{env.MAIN_PROJECT_MODULE}}
        run: ./gradlew :composeApp:assembleRelease
        env:
          ORG_GRADLE_PROJECT_storePassword: ${{secrets.ANDROID_STORE_PASSWORD}}
          ORG_GRADLE_PROJECT_keyPassword: ${{secrets.ANDROID_KEY_PASSWORD}}
          ORG_GRADLE_PROJECT_keyAlias: ${{secrets.ANDROID_KEY_ALIAS}}
          ORG_GRADLE_PROJECT_storeFile: composeApp/keydemiapp.jks
      - name: Find the APK
        id: find_apk
        run: |
          APK_PATH=$(find composeApp/ -path '*/apk/release/*.apk' -o -path '*/outputs/apk/release/*.apk' | head -1)
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "Found APK at: ${APK_PATH}"
          if [ -z "${APK_PATH}" ]; then
            echo "APK not found!"
            find . -name "*.apk"
            exit 1
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.PLAYSTORE_NAME }} - ${{ env.repository_name }}  - APK Release generated
          path: ${{steps.find_apk.outputs.APK_PATH}}
