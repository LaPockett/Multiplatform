name: Build DEBUG IPA
run-name: ${{github.actor}} Build DEBUG IPA
on:
  push:
    branches: [master]
env:
  MAIN_PROJECT_MODULE: 'composeApp'
  PLAYSTORE_NAME: 'App Mock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-setup:
    uses: LaPockett/Multiplatform/.github/workflows/setup.yml@master

  build_debug_ios_app:
    needs: call-workflow-setup
    name: Build iOS App
    if: ${{ inputs.build_type == 'Debug' }}
    runs-on: macos-latest

    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode_version: latest-stable

      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Build iOS App
        uses: HekmatullahAmin/mifos-x-actionhub-build-ios-app@enhance-ios-build-action
        with:
          build_type: ${{ inputs.build_type }}
