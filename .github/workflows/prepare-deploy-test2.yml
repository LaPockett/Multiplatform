name: Prepare deploy test 2
run-name: ${{ github.actor }} Prepare deploy test 2
on:
  pull_request:
    types: [closed]
    branches: [master]
  push:
    branches: [master]
jobs:
  call-workflow:
    uses: LaPockett/Multiplatform/.github/workflows/setup.yml@master
  publish:
    needs: call-workflow
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/master'

    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install Dependencies
        run: |
          npm ci
          npm audit
          npm audit fix

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
