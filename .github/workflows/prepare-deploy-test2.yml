name: Debug Semantic Versioning
run-name: ${{ github.actor }} Debug Semantic Versioning
on:
  push:
    branches: [master]
jobs:
  call-workflow:
    uses: LaPockett/Multiplatform/.github/workflows/setup.yml@master
  publish:
    needs: call-workflow
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/master'

    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Dependencies
        run: |
          npm ci
          npm audit
          npm audit fix

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
