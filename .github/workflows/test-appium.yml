name: GitHub Actions - Appium Tests Prueba
run-name: ${{ github.actor }} Appium Tests Prueba
on:
  push:
    branches: ["LaPockett-patch-1"]

jobs:
  call-workflow:
    uses: LaPockett/Multiplatform/.github/workflows/setup.yml@master

  appium:
    needs: call-workflow
    runs-on: self-hosted
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          npm i --location=global appium
          appium driver install uiautomator2
          npm init
          npm i --save-dev webdriverio
          appium & sleep 10
      - name: Android Emulator Runner
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 29
          emulator-build: 7425822
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            emulator -list-avds
            emulator -avd Pixel_8_Pro
            adb install /home/usuario/Descargas/upload/composeApp-release.apk
      - run: |
          node appium/testAll.js
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: composeApp/build/reports