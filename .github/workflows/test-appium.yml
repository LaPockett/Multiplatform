name: GitHub Actions - Appium Tests Prueba
run-name: ${{ github.actor }} Appium Tests Prueba
on:
  push:
    branches: ["LaPockett-patch-1"]
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'jetbrains'
  MAVEN_CACHE: 'gradle'
  NODE_VERSION: '18'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.MAVEN_CACHE }}
      - name: Install dependencies
        run: | 
          npm cache clean --force
          npm cache verify
          npm install -g npm
      - name: Start Appium Server
        uses: FinbertMDS/setup-appium@latest
        with:
          appium-version: "2.18.0"
      - run: |
          appium driver install uiautomator2
          npm i --save-dev webdriverio
          appium & sleep 10
          node appium/testAll.js
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results