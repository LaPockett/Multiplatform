name: GitHub Actions - Appium Tests Prueba
run-name: ${{ github.actor }} Appium Tests Prueba
on:
  push:
    branches: ["LaPockett-patch-1"]
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_CACHE: 'gradle'
  NODE_VERSION: '22.14.0'
  APPIUM_VERSION: '2.18.0'
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.MAVEN_CACHE }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
  appium:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and Run Appium Server
        uses: moatazeldebsy/Appium-Server-GitHub-Action@V1.0.8

      - name: Android Emulator Runner
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 29
          emulator-build: 7425822
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew connectedCheck

      - run: |
          appium driver install uiautomator2
          npm i --save-dev webdriverio
          appium & sleep 10
          node appium/testAll.js
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: composeApp/build/reports