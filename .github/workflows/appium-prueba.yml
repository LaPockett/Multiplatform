name: Prueba de Appium moatazeldebsy
run-name: ${{ github.actor }} prueba de appium moatazeldebsy
on: [push]
env:
  APPIUM_VERSION: '2.18.0'
  NODE_VERSION: '22.14.0'
jobs:
  setup:
    runs-on: self-hosted
    name: Appium Test
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Appium
        uses: FinbertMDS/setup-appium@v1.0.0
        with:
          appium-version: ${{ env.APPIUM_VERSION }}
      - run: |
          appium --version
          appium & sleep 5