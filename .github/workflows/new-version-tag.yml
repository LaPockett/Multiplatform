#No lo uso, está deshabilitado en Github, es para tenerlo yo en cuenta
name: Versionado
run-name: ${{ github.actor }} Versionado
on:
  push:
    branches: [master]
jobs:
  prepare_deploy:
    runs-on: self-hosted
    steps:
      -   uses: actions/checkout@v6.0.2
          with:
            fetch-depth: 0
      -   name: Set env
          id: last_tag
          run: |
            echo "LAST_TAG=$(git tag --sort=committerdate | tail -1)" >> $GITHUB_OUTPUT
            echo "${{ steps.last_tag.outputs.LAST_TAG }}"
      -   uses: actions-ecosystem/action-bump-semver@v1
          id: bump-semver
          with:
            current_version: ${{ steps.last_tag.outputs.LAST_TAG }}
            level: minor

      -   run: |
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag ${{ steps.bump-semver.outputs.new_version }}
            git push --tags
      -   name: "Set output"
          id: set-output
          run: |
            echo "app_mock_version_name=${{ steps.bump-semver.outputs.new_version }}" >> $GITHUB_OUTPUT
            
            IFS='.' read -r major minor patch <<< "${{ steps.bump-semver.outputs.new_version }}"
            app_mock_version_code=$((major * 10000 + minor * 100 + patch))
            
            echo "app_mock_version_code=${app_mock_version_code}" >> $GITHUB_OUTPUT
      -   name: "Print output"
          run: |
            echo -e "Version name is: \n ${{ steps.set-output.outputs.app_mock_version_name }}"
            echo -e "Version code is: \n ${{ steps.set-output.outputs.app_mock_version_code }}"
    outputs:
      output_write_app_mock_version_name: ${{ steps.set-output.outputs.app_mock_version_name }}
      output_write_app_mock_version_code: ${{ steps.set-output.outputs.app_mock_version_code }}