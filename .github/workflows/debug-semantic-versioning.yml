name: Debug Semantic Versioning
run-name: ${{ github.actor }} Debug Semantic Versioning
on:
  push:
    branches: [master]

jobs:
  call-workflow:
    uses: LaPockett/Multiplatform/.github/workflows/setup-project.yml@master
  publish:
    needs: call-workflow

    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
